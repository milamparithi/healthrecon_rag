name: healthrecon-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rag}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rag}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-please-change-in-prod-1234567890}
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: 6334
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_EMBEDDING_DIMENSION: ${LLM_EMBEDDING_DIMENSION:-1536}
      MAX_UPLOAD_BYTES_PER_USER: ${MAX_UPLOAD_BYTES_PER_USER:-104857600}
      RAG_GUARDRAILS_ENABLED: ${RAG_GUARDRAILS_ENABLED:-true}
      RAG_GUARDRAILS_MAX_INPUT_CHARS: ${RAG_GUARDRAILS_MAX_INPUT_CHARS:-1000}
      RAG_GUARDRAILS_REQUIRE_CITATION: ${RAG_GUARDRAILS_REQUIRE_CITATION:-true}
      RAG_GUARDRAILS_HALLUCINATION_MIN_COVERAGE: ${RAG_GUARDRAILS_HALLUCINATION_MIN_COVERAGE:-0.4}
      RAG_GUARDRAILS_RATE_LIMIT_REQUESTS: ${RAG_GUARDRAILS_RATE_LIMIT_REQUESTS:-60}
      RAG_GUARDRAILS_RATE_LIMIT_WINDOW_SECONDS: ${RAG_GUARDRAILS_RATE_LIMIT_WINDOW_SECONDS:-60}
      RAG_GUARDRAILS_MAX_MESSAGES_PER_CONVERSATION: ${RAG_GUARDRAILS_MAX_MESSAGES_PER_CONVERSATION:-300}
      RAG_GUARDRAILS_LLM_CHECK_ENABLED: ${RAG_GUARDRAILS_LLM_CHECK_ENABLED:-false}
      RAG_QUERY_REWRITE_ENABLED: ${RAG_QUERY_REWRITE_ENABLED:-false}
      RAG_QUERY_REWRITE_MAX_CHARS: ${RAG_QUERY_REWRITE_MAX_CHARS:-200}
      RAG_QUERY_REWRITE_SYSTEM_PROMPT: ${RAG_QUERY_REWRITE_SYSTEM_PROMPT:-Rewrite the user's question into a single concise standalone search query that captures the exact information being asked, incorporating any context from the conversation history. Then answer with ONLY the rewritten query, no explanation.}
      RAG_CACHE_ENABLED: ${RAG_CACHE_ENABLED:-true}
      RAG_CACHE_SIMILARITY_THRESHOLD: ${RAG_CACHE_SIMILARITY_THRESHOLD:-0.92}
      RAG_CACHE_TTL_SECONDS: ${RAG_CACHE_TTL_SECONDS:-604800}
      RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-true}
      RAG_SEARCH_CANDIDATES: ${RAG_SEARCH_CANDIDATES:-30}
      RAG_SEARCH_FUSION: ${RAG_SEARCH_FUSION:-rrf}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
      RAG_RERANK_MODE: ${RAG_RERANK_MODE:-none}
      EVAL_ENABLED: ${EVAL_ENABLED:-true}
      EVAL_SAMPLE_RATE: ${EVAL_SAMPLE_RATE:-0.1}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-dev}
      LANGFUSE_SAMPLE_RATIO: ${LANGFUSE_SAMPLE_RATIO:-1.0}

    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rag
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:

networks:
  rag:
    driver: bridge